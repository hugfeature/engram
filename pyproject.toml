[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-engram"
dynamic = ["version"]
description = "AI Agent Continuity Engine — task-centric memory, session handoff with validation, error-aware recall, Ebbinghaus decay, hybrid retrieval (BM25+vector+graph), quality scoring. Local-first, zero cloud dependency."
readme = "README.md"
license = "MIT"
authors = [
    {name = "hugfeature"},
]
keywords = ["mcp", "memory", "agent", "continuity", "task", "handoff", "ebbinghaus", "vector-search", "duckdb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "duckdb>=0.10.0",
    "networkx>=3.0",
    "sentence-transformers>=2.0.0",
    "numpy>=1.24.0,<3.0",
    "apscheduler>=3.10.0,<4.0.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

[project.urls]
Homepage = "https://github.com/hugfeature/engram"
Repository = "https://github.com/hugfeature/engram"

[project.scripts]
engram = "engram.server:main"
engram-setup = "engram.setup_cli:main"
engram-http = "engram.http_server:main"
engram-server = "engram.daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["src/engram"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.version]
path = "src/engram/__init__.py"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]
